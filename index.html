<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navshakti Pass Alert</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #7b1e3a, #c44536);
            color: white;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        h1 { margin: 0 0 10px; font-size: 28px; }
        .subtitle { opacity: 0.9; margin-bottom: 30px; }
        .step {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 18px;
            margin: 15px 0;
            text-align: left;
        }
        .step-number {
            display: inline-block;
            background: #ffd700;
            color: #7b1e3a;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-weight: bold;
            margin-right: 10px;
        }
        .btn {
            display: inline-block;
            background: #ffd700;
            color: #7b1e3a;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
        .warning {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            font-size: 15px;
        }
        .footer { margin-top: 30px; font-size: 13px; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Navshakti Pass Alert</h1>
        <p class="subtitle">Get instant loud notification when passes open</p>

        <div class="step">
            <span class="step-number">1</span>
            Open the Telegram bot
        </div>

        <div class="step">
            <span class="step-number">2</span>
            Press <strong>Start</strong> button
        </div>

        <div class="step">
            <span class="step-number">3</span>
            You will receive confirmation
        </div>

        <a href="https://t.me/NavshaktiDhairyaBot" class="btn" target="_blank">
            Open Telegram Bot
        </a>

        <div class="warning">
            <strong>Important:</strong><br>
            Keep your Telegram notification sound <strong>ON</strong><br>
            and allow notifications from this bot.
        </div>

        <div class="footer">
            Generated by Dhairya’s AI Agent
        </div>
    </div>
</body>
</html>
